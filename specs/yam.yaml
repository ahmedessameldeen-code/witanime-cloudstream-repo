# site2cs site specification
# Edit any value below, then run:  site2cs generate <this-file>
# Selector syntax:  "css"  |  "css::text"  |  "css::attr(href)"
# Use {query} inside search.path where the search term goes.

site:
  name: اهواك تي في
  base_url: https://yam.ahwaktv.net
  language: en
  description: اهواك تي في - generated by site2cs
  icon: https://yam.ahwaktv.net/templates/ahwak/img/favicon-32x32.png
  authors:
  - site2cs
  tv_types:
  - TvSeries
  - Movie
archetype: generic
home:
- name: Latest
  path: /
  horizontal: false
- name: مسلسلات
  path: /moslslat.php
  horizontal: false
- name: جديد الأفلام
  path: /newvideos.php
  horizontal: false
search:
  path: ?s={query}
  method: GET
  body: ''
selectors:
  cards: li
  card_link: a[href*='watch']::attr(href)
  card_title: img::attr(alt)
  card_poster: img::attr(src)
  next_page: ''
  detail_title: h1::text
  detail_poster: meta[property='og:image']::attr(content)
  detail_plot: meta[property='og:description']::attr(content)
  detail_year: ''
  detail_tags: ''
  episodes: ul.s a
  episode_link: a::attr(href)
  episode_title: a::text
  servers: ''
headers: {}
repo:
  github: ahmedessameldeen-code/witanime-cloudstream-repo
  namespace: site2cs
  repo_name: My CloudStream Plugins
  repo_description: CloudStream plugins generated with site2cs
use_webview: false
notes: []
version: 1
