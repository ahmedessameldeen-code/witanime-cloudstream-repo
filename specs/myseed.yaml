# site2cs site specification
# Edit any value below, then run:  site2cs generate <this-file>
# Selector syntax:  "css"  |  "css::text"  |  "css::attr(href)"
# Use {query} inside search.path where the search term goes.

site:
  name: ‎ماي سيد - MySeed
  base_url: https://m.myseed.tv
  language: en
  description: ‎ماي سيد - MySeed - generated by site2cs
  icon: ''
  authors:
  - site2cs
  tv_types:
  - TvSeries
  - Movie
archetype: generic
home:
- name: Latest
  path: /main/
  horizontal: false
search:
  path: ?s={query}
  method: GET
  body: ''
selectors:
  cards: ul.movie__blocks__ul li
  card_link: a[href^='http']::attr(href)
  card_title: img::attr(alt)
  card_poster: img::attr(data-src)
  next_page: a.next::attr(href)
  detail_title: h1::text
  detail_poster: meta[property='og:image']::attr(content)
  detail_plot: meta[property='og:description']::attr(content)
  detail_year: ''
  detail_tags: ''
  episodes: li a
  episode_link: a::attr(href)
  episode_title: a::text
  servers: iframe::attr(src)
headers: {}
repo:
  github: ahmedessameldeen-code/witanime-cloudstream-repo
  namespace: site2cs
  repo_name: My CloudStream Plugins
  repo_description: CloudStream plugins generated with site2cs
use_webview: false
notes:
- not detected
- Search endpoint not detected - search will be disabled until you fill search.path.
version: 1
