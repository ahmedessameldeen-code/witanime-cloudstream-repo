name: Build plugins

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build
        working-directory: src
        run: |
          chmod +x gradlew || true
          ./gradlew make makePluginsJson --no-daemon

      - name: Publish artifacts to the 'builds' branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BUILDS_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if git ls-remote --exit-code --heads "$BUILDS_URL" builds >/dev/null 2>&1; then
            git clone --branch builds --single-branch "$BUILDS_URL" builds
          else
            mkdir -p builds && cd builds
            git init
            git checkout --orphan builds
            git remote add origin "$BUILDS_URL"
            touch .gitkeep && git add .gitkeep
            git -c user.email=actions@github.com -c user.name=actions commit -m init
            git push origin builds
            cd ..
          fi

          cp src/build/plugins.json builds/plugins.json
          find src -name "*.cs3" -exec cp {} builds/ \;
          cp src/repo.json builds/repo.json

          cd builds
          git config user.email actions@github.com
          git config user.name "GitHub Actions"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build ${GITHUB_SHA}"
            git push origin builds
          fi
